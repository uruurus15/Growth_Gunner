[package]
name = "growth_gunner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Growth_Gunner"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
